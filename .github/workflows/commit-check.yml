name: commit-check

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Validate last commit message
        run: |
          # Берем сообщение последнего коммита и проверяем его через stdin
          git log -1 --pretty=%B | npx commitlint --verbose